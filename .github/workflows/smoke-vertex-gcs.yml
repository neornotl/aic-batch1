name: Smoke test Vertex video summary via GCS

on:
  push:
    branches:
      - codex/vertex-gcs-summaries
  workflow_dispatch:
    inputs:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check google-genai google-cloud-storage
      - name: Generate tiny test video
        run: |
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i color=c=navy:s=320x180:r=10 \
            -f lavfi -i sine=frequency=440:sample_rate=16000 \
            -t 3 -c:v libx264 -pix_fmt yuv420p -c:a aac -b:a 32k \
            "$RUNNER_TEMP/smoke.mp4"
      - name: Upload test video and call Vertex through GCS
        env:
          VERTEX_API_KEY: ${{ secrets.VERTEX_API_KEY }}
          GCS_SA_JSON: ${{ secrets.GCS_SERVICE_ACCOUNT_JSON || secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CLOUD_PROJECT: aic2026-drive-ingest
          GCS_BUCKET: run-sources-aic2026-drive-ingest-us-central1
          VERTEX_MODEL: gemini-2.5-flash
        run: |
          set -euo pipefail
          test -n "$VERTEX_API_KEY" || { echo 'Missing VERTEX_API_KEY'; exit 1; }
          test -n "$GCS_SA_JSON" || { echo 'Missing GCS service-account JSON'; exit 1; }
          printf '%s' "$GCS_SA_JSON" > "$RUNNER_TEMP/gcs-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gcs-sa.json"
          mkdir -p summaries
          PYTHONPATH=. python scripts/smoke_vertex_gcs.py \
            "$RUNNER_TEMP/smoke.mp4" \
            summaries/video_summaries_smoke.jsonl
      - name: Upload smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: vertex-gcs-smoke
          path: summaries/video_summaries_smoke.jsonl
          if-no-files-found: error
          retention-days: 7

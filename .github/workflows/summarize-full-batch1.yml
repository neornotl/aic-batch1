name: Summarize full official Batch 1 videos

on:
  workflow_dispatch:
    inputs:
      workers:
        description: "Concurrent videos per worker (1-2 recommended)"
        required: false
        default: "2"
        type: string
      repair:
        description: "Run the isolated malformed-summary repair matrix"
        required: false
        default: false
        type: boolean
      targets:
        description: "Comma-separated video IDs for repair mode"
        required: false
        default: "L23_V001,L23_V005,L23_V023,L24_V019,L24_V028,L28_V008,L26_V301,L26_V318,L26_V330,L26_V333"
        type: string
      resume:
        description: "Resume the six batches cancelled by the old timeout"
        required: false
        default: false
        type: boolean
      compact:
        description: "Use a concise schema-complete prompt for truncated-response retries"
        required: false
        default: false
        type: boolean
      resume_l29:
        description: "Run L29 in an isolated resume job"
        required: false
        default: false
        type: boolean
      keyframe_asr:
        description: "Run the isolated BTC-keyframe vision + Deepgram Batch 1 lane"
        required: false
        default: false
        type: boolean
      chunk_size:
        description: "BTC keyframes per Gemini request in keyframe_asr mode"
        required: false
        default: "220"
        type: string
      limit:
        description: "Optional per-batch video limit in keyframe_asr mode (0 = full)"
        required: false
        default: "0"
        type: string
      vision_only:
        description: "Skip Deepgram and retry only missing Gemini keyframe rows"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ inputs.keyframe_asr && 'aic-video-keyframe-asr' || inputs.resume_l29 && 'aic-video-summary-resume-l29' || inputs.resume && 'aic-video-summary-resume' || inputs.repair && 'aic-video-summary-repair' || 'aic-video-summary-batch1' }}
  cancel-in-progress: false

jobs:
  summarize:
    if: ${{ !inputs.repair && !inputs.resume && !inputs.resume_l29 && !inputs.keyframe_asr }}
    name: Summarize ${{ matrix.batch }}
    runs-on: ubuntu-latest
    # A full range-download + Vertex pass can exceed five hours on a busy
    # runner.  Keep the existing resumable checkpoint, but avoid terminating a
    # healthy worker before its batch is complete.
    timeout-minutes: 720
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        batch: [L21, L22, L23, L24, L25, L26_a, L26_b, L26_c, L26_d, L26_e, L27, L28, L29, L30]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg rclone
          python -m pip install --disable-pip-version-check requests google-genai google-cloud-storage
      - name: Summarize videos with checkpoint
        env:
          VERTEX_API_KEY: ${{ secrets.VERTEX_API_KEY }}
          # Prefer a dedicated GCS key; fall back to the existing Drive SA key
          # so the workflow works immediately after the bucket IAM grant.
          GCS_SA_JSON: ${{ secrets.GCS_SERVICE_ACCOUNT_JSON || secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          VERTEX_MODEL: gemini-2.5-flash
          GCS_BUCKET: run-sources-aic2026-drive-ingest-us-central1
          GOOGLE_CLOUD_PROJECT: aic2026-drive-ingest
          BATCH: ${{ matrix.batch }}
          WORKERS: ${{ inputs.workers }}
        run: |
          test -n "$VERTEX_API_KEY" || { echo 'Missing VERTEX_API_KEY'; exit 1; }
          test -n "$GCS_SA_JSON" || { echo 'Missing GCS_SERVICE_ACCOUNT_JSON (or GDRIVE_SERVICE_ACCOUNT_JSON)'; exit 1; }
          printf '%s' "$GCS_SA_JSON" > "$RUNNER_TEMP/gcs-sa.json"
          python - "$RUNNER_TEMP/gcs-sa.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)
          if payload.get("type") != "service_account" or not payload.get("client_email"):
              raise SystemExit("GCS credential is not a service-account JSON key")
          print("Using configured GCS service account for temporary video objects")
          PY
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gcs-sa.json"
          mkdir -p summaries
          PYTHONPATH=. python scripts/summarize_official_videos.py \
            --batch "$BATCH" \
            --workers "$WORKERS" \
            --gcs-bucket "$GCS_BUCKET" \
            --output "summaries/video_summaries_${BATCH}.jsonl"
      - name: Upload summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-summaries-${{ matrix.batch }}
          path: summaries/video_summaries_${{ matrix.batch }}.jsonl
          retention-days: 14
      - name: Publish summary to Drive (ZIPs remain untouched)
        env:
          OAUTH_CONFIG: ${{ secrets.RCLONE_CONFIG_DRIVE }}
          SA: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          FOLDER: '1E8u-YURTRexdR1Ax4Hu2aq7Vt646VQuN'
          BATCH: ${{ matrix.batch }}
        run: |
          test -n "$OAUTH_CONFIG" || test -n "$SA" || { echo 'Missing Drive credential'; exit 1; }
          mkdir -p "$RUNNER_TEMP/rclone"
          if test -n "$OAUTH_CONFIG"; then
            printf '%s' "$OAUTH_CONFIG" > "$RUNNER_TEMP/rclone/rclone.conf"
          else
            printf '%s' "$SA" > "$RUNNER_TEMP/rclone/sa.json"
            {
              echo '[drive]'; echo 'type = drive'; echo 'scope = drive'
              echo "service_account_file = $RUNNER_TEMP/rclone/sa.json"
              echo "root_folder_id = $FOLDER"
            } > "$RUNNER_TEMP/rclone/rclone.conf"
          fi
          export RCLONE_CONFIG="$RUNNER_TEMP/rclone/rclone.conf"
          rclone copyto "summaries/video_summaries_${BATCH}.jsonl" \
            "drive:03_Video_Summaries/video_summaries_${BATCH}.jsonl" \
            --transfers 1 --checkers 1 --retries 6 --low-level-retries 20
  keyframe_visual:
    if: ${{ inputs.keyframe_asr }}
    name: BTC keyframes ${{ matrix.batch }}
    runs-on: ubuntu-latest
    timeout-minutes: 720
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {batch: L21, archive: Keyframes_L21.zip}
          - {batch: L22, archive: Keyframes_L22.zip}
          - {batch: L23, archive: Keyframes_L23.zip}
          - {batch: L24, archive: Keyframes_L24.zip}
          - {batch: L25, archive: Keyframes_L25.zip}
          - {batch: L26_a, archive: Keyframes_L26_a.zip}
          - {batch: L26_b, archive: Keyframes_L26_b.zip}
          - {batch: L26_c, archive: Keyframes_L26_c.zip}
          - {batch: L26_d, archive: Keyframes_L26_d.zip}
          - {batch: L26_e, archive: Keyframes_L26_e.zip}
          - {batch: L27, archive: Keyframes_L27.zip}
          - {batch: L28, archive: Keyframes_L28.zip}
          - {batch: L29, archive: Keyframes_L29.zip}
          - {batch: L30, archive: Keyframes_L30.zip}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check google-genai
      - name: Download BTC keyframe archive without extraction
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y aria2
          mkdir -p "$RUNNER_TEMP/btc"
          aria2c -c -x 8 -s 8 -k 4M --file-allocation=none \
            -d "$RUNNER_TEMP/btc" \
            "https://aic-data.ledo.io.vn/${{ matrix.archive }}"
          df -h "$RUNNER_TEMP"
      - name: Inspect official keyframes with Gemini
        env:
          VERTEX_API_KEY: ${{ secrets.VERTEX_API_KEY }}
          VERTEX_MODEL: gemini-2.5-flash
          BATCH: ${{ matrix.batch }}
          WORKERS: ${{ inputs.workers }}
          CHUNK_SIZE: ${{ inputs.chunk_size }}
          LIMIT: ${{ inputs.limit }}
        run: |
          test -n "$VERTEX_API_KEY" || { echo 'Missing VERTEX_API_KEY'; exit 1; }
          mkdir -p summaries
          PYTHONPATH=. python scripts/vision_keyframes_batch1.py \
            --archive "$RUNNER_TEMP/btc/${{ matrix.archive }}" \
            --output "summaries/keyframe_vision_${BATCH}.jsonl" \
            --workers "$WORKERS" --chunk-size "$CHUNK_SIZE" --limit "$LIMIT" \
            --skip-list config/batch1_reuse_video_ids_full.txt
      - name: Upload visual sidecar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyframe-vision-${{ matrix.batch }}
          path: summaries/keyframe_vision_${{ matrix.batch }}.jsonl
          if-no-files-found: warn
          retention-days: 30
      - name: Publish visual sidecar to Drive
        if: ${{ false }}
        env:
          OAUTH_CONFIG: ${{ secrets.RCLONE_CONFIG_DRIVE }}
          SA: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          FOLDER: '1E8u-YURTRexdR1Ax4Hu2aq7Vt646VQuN'
          BATCH: ${{ matrix.batch }}
        run: |
          test -f "summaries/keyframe_vision_${BATCH}.jsonl" || exit 0
          test -n "$OAUTH_CONFIG" || test -n "$SA" || { echo 'Missing Drive credential'; exit 1; }
          sudo apt-get update -qq && sudo apt-get install -y rclone
          mkdir -p "$RUNNER_TEMP/rclone"
          if test -n "$SA"; then
            printf '%s' "$SA" > "$RUNNER_TEMP/rclone/sa.json"
            {
              echo '[drive]'; echo 'type = drive'; echo 'scope = drive'
              echo "service_account_file = $RUNNER_TEMP/rclone/sa.json"
              echo "root_folder_id = $FOLDER"
            } > "$RUNNER_TEMP/rclone/rclone.conf"
          else
            printf '%s' "$OAUTH_CONFIG" > "$RUNNER_TEMP/rclone/rclone.conf"
          fi
          export RCLONE_CONFIG="$RUNNER_TEMP/rclone/rclone.conf"
          rclone mkdir "drive:03_Video_Summaries/keyframe_vision"
          rclone copyto "summaries/keyframe_vision_${BATCH}.jsonl" \
            "drive:03_Video_Summaries/keyframe_vision/keyframe_vision_${BATCH}.jsonl" \
            --transfers 1 --checkers 1 --retries 6 --low-level-retries 20


  keyframe_asr:
    if: ${{ inputs.keyframe_asr && !inputs.vision_only }}
    name: Deepgram ASR ${{ matrix.batch }}
    runs-on: ubuntu-latest
    timeout-minutes: 720
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        batch: [L21, L22, L23, L24, L25, L26_a, L26_b, L26_c, L26_d, L26_e, L27, L28, L29, L30]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Transcribe official audio with Deepgram
        env:
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          DEEPGRAM_MODEL: nova-3
          DEEPGRAM_LANGUAGE: vi
          BATCH: ${{ matrix.batch }}
          WORKERS: ${{ inputs.workers }}
          LIMIT: ${{ inputs.limit }}
        run: |
          test -n "$DEEPGRAM_API_KEY" || { echo 'Missing DEEPGRAM_API_KEY'; exit 1; }
          mkdir -p transcripts
          PYTHONPATH=. python scripts/deepgram_batch1_asr.py \
            --batch "$BATCH" \
            --output "transcripts/deepgram_${BATCH}.jsonl" \
            --workers "$WORKERS" --model "$DEEPGRAM_MODEL" \
            --language "$DEEPGRAM_LANGUAGE" --limit "$LIMIT"
      - name: Upload transcript sidecar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepgram-${{ matrix.batch }}
          path: transcripts/deepgram_${{ matrix.batch }}.jsonl
          if-no-files-found: warn
          retention-days: 30
      - name: Publish transcript sidecar to Drive
        if: ${{ false }}
        env:
          OAUTH_CONFIG: ${{ secrets.RCLONE_CONFIG_DRIVE }}
          SA: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          FOLDER: '1E8u-YURexdR1Ax4Hu2aq7Vt646VQuN'
          BATCH: ${{ matrix.batch }}
        run: |
          test -f "transcripts/deepgram_${BATCH}.jsonl" || exit 0
          test -n "$OAUTH_CONFIG" || test -n "$SA" || { echo 'Missing Drive credential'; exit 1; }
          sudo apt-get update -qq && sudo apt-get install -y rclone
          mkdir -p "$RUNNER_TEMP/rclone"
          if test -n "$SA"; then
            printf '%s' "$SA" > "$RUNNER_TEMP/rclone/sa.json"
            {
              echo '[drive]'; echo 'type = drive'; echo 'scope = drive'
              echo "service_account_file = $RUNNER_TEMP/rclone/sa.json"
              echo "root_folder_id = $FOLDER"
            } > "$RUNNER_TEMP/rclone/rclone.conf"
          else
            printf '%s' "$OAUTH_CONFIG" > "$RUNNER_TEMP/rclone/rclone.conf"
          fi
          export RCLONE_CONFIG="$RUNNER_TEMP/rclone/rclone.conf"
          rclone mkdir "drive:03_Video_Summaries/deepgram"
          rclone copyto "transcripts/deepgram_${BATCH}.jsonl" \
            "drive:03_Video_Summaries/deepgram/deepgram_${BATCH}.jsonl" \
            --transfers 1 --checkers 1 --retries 6 --low-level-retries 20



  repair:
    if: ${{ inputs.repair && !inputs.keyframe_asr }}
    name: Repair ${{ matrix.batch }}
    runs-on: ubuntu-latest
    timeout-minutes: 720
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        batch: [L22, L23, L24, L26_d, L28]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg rclone
          python -m pip install --disable-pip-version-check requests google-genai google-cloud-storage
      - name: Repair selected summaries
        env:
          VERTEX_API_KEY: ${{ secrets.VERTEX_API_KEY }}
          GCS_SA_JSON: ${{ secrets.GCS_SERVICE_ACCOUNT_JSON || secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          VERTEX_MODEL: gemini-2.5-flash
          GCS_BUCKET: run-sources-aic2026-drive-ingest-us-central1
          GOOGLE_CLOUD_PROJECT: aic2026-drive-ingest
          BATCH: ${{ matrix.batch }}
          WORKERS: ${{ inputs.workers }}
          TARGETS: ${{ inputs.targets }}
          COMPACT: ${{ inputs.compact }}
        run: |
          test -n "$VERTEX_API_KEY" || { echo 'Missing VERTEX_API_KEY'; exit 1; }
          test -n "$GCS_SA_JSON" || { echo 'Missing GCS_SERVICE_ACCOUNT_JSON (or GDRIVE_SERVICE_ACCOUNT_JSON)'; exit 1; }
          printf '%s' "$GCS_SA_JSON" > "$RUNNER_TEMP/gcs-sa.json"
          python - "$RUNNER_TEMP/gcs-sa.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)
          if payload.get("type") != "service_account" or not payload.get("client_email"):
              raise SystemExit("GCS credential is not a service-account JSON key")
          print("Using configured GCS service account for temporary video objects")
          PY
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gcs-sa.json"
          mkdir -p summaries
          if test "$COMPACT" = "true"; then COMPACT_ARG=--compact; else COMPACT_ARG=; fi
          PYTHONPATH=. python scripts/summarize_official_videos.py \
            --batch "$BATCH" \
            --workers "$WORKERS" \
            --video-ids "$TARGETS" \
            $COMPACT_ARG \
            --gcs-bucket "$GCS_BUCKET" \
            --output "summaries/video_summaries_repair_${BATCH}.jsonl"
      - name: Upload repair artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-summaries-repair-${{ matrix.batch }}
          path: summaries/video_summaries_repair_${{ matrix.batch }}.jsonl
          if-no-files-found: warn
          retention-days: 14
      - name: Publish repair summary to Drive
        if: always()
        env:
          OAUTH_CONFIG: ${{ secrets.RCLONE_CONFIG_DRIVE }}
          SA: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          FOLDER: '1E8u-YURTRexdR1Ax4Hu2aq7Vt646VQuN'
          BATCH: ${{ matrix.batch }}
        run: |
          test -f "summaries/video_summaries_repair_${BATCH}.jsonl" || { echo 'No repair output to publish'; exit 0; }
          test -n "$OAUTH_CONFIG" || test -n "$SA" || { echo 'Missing Drive credential'; exit 1; }
          mkdir -p "$RUNNER_TEMP/rclone"
          if test -n "$OAUTH_CONFIG"; then
            printf '%s' "$OAUTH_CONFIG" > "$RUNNER_TEMP/rclone/rclone.conf"
          else
            printf '%s' "$SA" > "$RUNNER_TEMP/rclone/sa.json"
            {
              echo '[drive]'; echo 'type = drive'; echo 'scope = drive'
              echo "service_account_file = $RUNNER_TEMP/rclone/sa.json"
              echo "root_folder_id = $FOLDER"
            } > "$RUNNER_TEMP/rclone/rclone.conf"
          fi
          export RCLONE_CONFIG="$RUNNER_TEMP/rclone/rclone.conf"
          rclone mkdir "drive:03_Video_Summaries/repairs"
          rclone copyto "summaries/video_summaries_repair_${BATCH}.jsonl" \
            "drive:03_Video_Summaries/repairs/video_summaries_repair_${BATCH}.jsonl" \
            --transfers 1 --checkers 1 --retries 6 --low-level-retries 20

  resume:
    if: ${{ inputs.resume && !inputs.keyframe_asr }}
    name: Resume ${{ matrix.batch }}
    runs-on: ubuntu-latest
    timeout-minutes: 720
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        batch: [L21, L22, L25, L26_a, L26_b, L26_c]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg rclone
          python -m pip install --disable-pip-version-check requests google-genai google-cloud-storage
      - name: Resume batch summaries
        env:
          VERTEX_API_KEY: ${{ secrets.VERTEX_API_KEY }}
          GCS_SA_JSON: ${{ secrets.GCS_SERVICE_ACCOUNT_JSON || secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          VERTEX_MODEL: gemini-2.5-flash
          GCS_BUCKET: run-sources-aic2026-drive-ingest-us-central1
          GOOGLE_CLOUD_PROJECT: aic2026-drive-ingest
          BATCH: ${{ matrix.batch }}
          WORKERS: ${{ inputs.workers }}
        run: |
          test -n "$VERTEX_API_KEY" || { echo 'Missing VERTEX_API_KEY'; exit 1; }
          test -n "$GCS_SA_JSON" || { echo 'Missing GCS_SERVICE_ACCOUNT_JSON (or GDRIVE_SERVICE_ACCOUNT_JSON)'; exit 1; }
          printf '%s' "$GCS_SA_JSON" > "$RUNNER_TEMP/gcs-sa.json"
          python - "$RUNNER_TEMP/gcs-sa.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)
          if payload.get("type") != "service_account" or not payload.get("client_email"):
              raise SystemExit("GCS credential is not a service-account JSON key")
          print("Using configured GCS service account for temporary video objects")
          PY
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gcs-sa.json"
          mkdir -p summaries
          PYTHONPATH=. python scripts/summarize_official_videos.py \
            --batch "$BATCH" \
            --workers "$WORKERS" \
            --gcs-bucket "$GCS_BUCKET" \
            --output "summaries/video_summaries_${BATCH}.jsonl"
      - name: Upload resumed artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-summaries-resume-${{ matrix.batch }}
          path: summaries/video_summaries_${{ matrix.batch }}.jsonl
          if-no-files-found: warn
          retention-days: 14
      - name: Publish resumed summary to Drive
        if: always()
        env:
          OAUTH_CONFIG: ${{ secrets.RCLONE_CONFIG_DRIVE }}
          SA: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          FOLDER: '1E8u-YURTRexdR1Ax4Hu2aq7Vt646VQuN'
          BATCH: ${{ matrix.batch }}
        run: |
          test -f "summaries/video_summaries_${BATCH}.jsonl" || { echo 'No resumed output to publish'; exit 0; }
          test -n "$OAUTH_CONFIG" || test -n "$SA" || { echo 'Missing Drive credential'; exit 1; }
          mkdir -p "$RUNNER_TEMP/rclone"
          if test -n "$OAUTH_CONFIG"; then
            printf '%s' "$OAUTH_CONFIG" > "$RUNNER_TEMP/rclone/rclone.conf"
          else
            printf '%s' "$SA" > "$RUNNER_TEMP/rclone/sa.json"
            {
              echo '[drive]'; echo 'type = drive'; echo 'scope = drive'
              echo "service_account_file = $RUNNER_TEMP/rclone/sa.json"
              echo "root_folder_id = $FOLDER"
            } > "$RUNNER_TEMP/rclone/rclone.conf"
          fi
          export RCLONE_CONFIG="$RUNNER_TEMP/rclone/rclone.conf"
          rclone copyto "summaries/video_summaries_${BATCH}.jsonl" \
            "drive:03_Video_Summaries/video_summaries_${BATCH}.jsonl" \
            --transfers 1 --checkers 1 --retries 6 --low-level-retries 20

  resume_l29:
    if: ${{ inputs.resume_l29 && !inputs.keyframe_asr }}
    name: Resume L29
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg rclone
          python -m pip install --disable-pip-version-check requests google-genai google-cloud-storage
      - name: Resume L29 summary
        env:
          VERTEX_API_KEY: ${{ secrets.VERTEX_API_KEY }}
          GCS_SA_JSON: ${{ secrets.GCS_SERVICE_ACCOUNT_JSON || secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          VERTEX_MODEL: gemini-2.5-flash
          GCS_BUCKET: run-sources-aic2026-drive-ingest-us-central1
          GOOGLE_CLOUD_PROJECT: aic2026-drive-ingest
          BATCH: L29
          WORKERS: ${{ inputs.workers }}
        run: |
          test -n "$VERTEX_API_KEY" || { echo 'Missing VERTEX_API_KEY'; exit 1; }
          test -n "$GCS_SA_JSON" || { echo 'Missing GCS_SERVICE_ACCOUNT_JSON (or GDRIVE_SERVICE_ACCOUNT_JSON)'; exit 1; }
          printf '%s' "$GCS_SA_JSON" > "$RUNNER_TEMP/gcs-sa.json"
          python - "$RUNNER_TEMP/gcs-sa.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)
          if payload.get("type") != "service_account" or not payload.get("client_email"):
              raise SystemExit("GCS credential is not a service-account JSON key")
          print("Using configured GCS service account for temporary video objects")
          PY
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gcs-sa.json"
          mkdir -p summaries
          PYTHONPATH=. python scripts/summarize_official_videos.py \
            --batch "$BATCH" \
            --workers "$WORKERS" \
            --gcs-bucket "$GCS_BUCKET" \
            --output "summaries/video_summaries_${BATCH}.jsonl"
      - name: Upload L29 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-summaries-resume-L29
          path: summaries/video_summaries_L29.jsonl
          if-no-files-found: warn
          retention-days: 14
      - name: Publish L29 summary to Drive
        if: always()
        env:
          OAUTH_CONFIG: ${{ secrets.RCLONE_CONFIG_DRIVE }}
          SA: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          FOLDER: '1E8u-YURTRexdR1Ax4Hu2aq7Vt646VQuN'
        run: |
          test -f summaries/video_summaries_L29.jsonl || { echo 'No L29 output to publish'; exit 0; }
          test -n "$OAUTH_CONFIG" || test -n "$SA" || { echo 'Missing Drive credential'; exit 1; }
          mkdir -p "$RUNNER_TEMP/rclone"
          if test -n "$OAUTH_CONFIG"; then
            printf '%s' "$OAUTH_CONFIG" > "$RUNNER_TEMP/rclone/rclone.conf"
          else
            printf '%s' "$SA" > "$RUNNER_TEMP/rclone/sa.json"
            {
              echo '[drive]'; echo 'type = drive'; echo 'scope = drive'
              echo "service_account_file = $RUNNER_TEMP/rclone/sa.json"
              echo "root_folder_id = $FOLDER"
            } > "$RUNNER_TEMP/rclone/rclone.conf"
          fi
          export RCLONE_CONFIG="$RUNNER_TEMP/rclone/rclone.conf"
          rclone copyto summaries/video_summaries_L29.jsonl \
            drive:03_Video_Summaries/video_summaries_L29.jsonl \
            --transfers 1 --checkers 1 --retries 6 --low-level-retries 20

name: Upload Batch 2 Official Keyframes to Drive

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Batch 2 keyframe package (or traffic, news, all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - traffic
          - news
          - Keyframes_N001-N010
          - Keyframes_N011-N020
          - Keyframes_N021-N030
          - Keyframes_N031-N040
          - Keyframes_N041-N050
          - Keyframes_N051-N060
          - Keyframes_N061-N070
          - Keyframes_N071-N080
          - Keyframes_N081-N090
          - Keyframes_N091-N100
          - Keyframes_M01
          - Keyframes_M02
          - Keyframes_M03
          - Keyframes_M04
          - Keyframes_M05
          - Keyframes_M06
          - Keyframes_M07
          - Keyframes_M08
          - Keyframes_M09
          - Keyframes_M10

concurrency:
  group: aic-batch2-keyframes-ingest
  cancel-in-progress: false

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.set-pkgs.outputs.packages }}
    steps:
      - id: set-pkgs
        run: |
          SELECTED="${{ inputs.package }}"
          TRAFFIC='["Keyframes_N001-N010","Keyframes_N011-N020","Keyframes_N021-N030","Keyframes_N031-N040","Keyframes_N041-N050","Keyframes_N051-N060","Keyframes_N061-N070","Keyframes_N071-N080","Keyframes_N081-N090","Keyframes_N091-N100"]'
          NEWS='["Keyframes_M01","Keyframes_M02","Keyframes_M03","Keyframes_M04","Keyframes_M05","Keyframes_M06","Keyframes_M07","Keyframes_M08","Keyframes_M09","Keyframes_M10"]'
          
          if [ "$SELECTED" = "traffic" ]; then
            echo "packages=$TRAFFIC" >> "$GITHUB_OUTPUT"
          elif [ "$SELECTED" = "news" ]; then
            echo "packages=$NEWS" >> "$GITHUB_OUTPUT"
          elif [ "$SELECTED" = "all" ]; then
            # Concatenate both arrays
            echo "packages=$(jq -c -s '.[0] + .[1]' <<< "$TRAFFIC $NEWS")" >> "$GITHUB_OUTPUT"
          else
            echo "packages=[\"$SELECTED\"]" >> "$GITHUB_OUTPUT"
          fi

  upload:
    name: Unpack & Ingest ${{ matrix.package }}
    needs: setup-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        package: ${{ fromJson(needs.setup-matrix.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4

      - name: Maximize Runner Disk Space
        run: |
          echo "Initial disk space:"
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          echo "Disk space after cleaning:"
          df -h

      - name: Configure rclone
        env:
          OAUTH_CONFIG: ${{ secrets.RCLONE_CONFIG_DRIVE }}
          SA: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          FOLDER: '1E8u-YURTRexdR1Ax4Hu2aq7Vt646VQuN'
        run: |
          test -n "$OAUTH_CONFIG" || test -n "$SA" || { echo 'Missing Drive credential'; exit 1; }
          mkdir -p "$RUNNER_TEMP/rclone"
          if test -n "$OAUTH_CONFIG"; then
            printf '%s' "$OAUTH_CONFIG" > "$RUNNER_TEMP/rclone/rclone.conf"
            grep -q '^\[drive\]' "$RUNNER_TEMP/rclone/rclone.conf" || { echo 'Missing [drive] remote'; exit 1; }
            grep -q '^root_folder_id[[:space:]]*=' "$RUNNER_TEMP/rclone/rclone.conf" || { echo 'Missing root_folder_id'; exit 1; }
          else
            printf '%s' "$SA" > "$RUNNER_TEMP/rclone/sa.json"
            {
              echo '[drive]'
              echo 'type = drive'
              echo 'scope = drive'
              echo "service_account_file = $RUNNER_TEMP/rclone/sa.json"
              echo "root_folder_id = $FOLDER"
            } > "$RUNNER_TEMP/rclone/rclone.conf"
          fi
          echo "RCLONE_CONFIG=$RUNNER_TEMP/rclone/rclone.conf" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y rclone unzip curl aria2 jq

      - name: Download official keyframe archive
        run: |
          PKG="${{ matrix.package }}"
          URL="https://aic-data.ledo.io.vn/${PKG}.zip"
          echo "Downloading $URL via aria2c (16 connections)..."
          aria2c -x 16 -s 16 -k 1M --file-allocation=none --retry-wait=2 -m 10 "$URL" -d "$RUNNER_TEMP" -o "${PKG}.zip"
          ls -lh "$RUNNER_TEMP/${PKG}.zip"

      - name: Unpack keyframes
        run: |
          PKG="${{ matrix.package }}"
          EXTRACT_DIR="$RUNNER_TEMP/extracted"
          mkdir -p "$EXTRACT_DIR"
          echo "Extracting $PKG archive..."
          unzip -q "$RUNNER_TEMP/${PKG}.zip" -d "$EXTRACT_DIR"
          rm -f "$RUNNER_TEMP/${PKG}.zip"
          echo "Extracted directory contents:"
          ls -lh "$EXTRACT_DIR"

      - name: Upload unzipped official keyframes to Google Drive
        run: |
          PKG="${{ matrix.package }}"
          EXTRACT_DIR="$RUNNER_TEMP/extracted"
          SRC_DIR="$EXTRACT_DIR/keyframes"
          if [ ! -d "$SRC_DIR" ]; then
            SRC_DIR="$EXTRACT_DIR"
          fi
          DEST="drive:Keyframes/Batch2/${PKG}"
          echo "Uploading from $SRC_DIR to $DEST..."
          rclone copy "$SRC_DIR" "$DEST" \
            --transfers 16 \
            --checkers 32 \
            --fast-list \
            --drive-pacer-min-sleep 50ms \
            --stats 30s \
            -v
          rm -rf "$EXTRACT_DIR"
          echo "Upload of Batch 2 official keyframes for $PKG completed successfully!"

name: Upload official videos to Drive
on:
  workflow_dispatch:
    inputs:
      archive:
        description: 'One archive basename, or all'
        required: true
        default: Videos_L21_a.zip
        type: string
      folder_id:
        description: '01_Videos_Original folder ID (or repository variable GDRIVE_FOLDER_ID)'
        required: false
        type: string
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate inputs and configure rclone
        env:
          SA: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          FOLDER: ${{ inputs.folder_id || vars.GDRIVE_FOLDER_ID }}
        run: |
          test -n "$SA" || { echo 'Missing GDRIVE_SERVICE_ACCOUNT_JSON'; exit 1; }
          test -n "$FOLDER" || { echo 'Missing folder ID'; exit 1; }
          mkdir -p "$RUNNER_TEMP/rclone"
          printf '%s' "$SA" > "$RUNNER_TEMP/rclone/sa.json"
          {
            echo '[drive]'; echo 'type = drive'; echo 'scope = drive';
            echo "service_account_file = $RUNNER_TEMP/rclone/sa.json";
            echo "root_folder_id = $FOLDER";
          } > "$RUNNER_TEMP/rclone/rclone.conf"
          echo "RCLONE_CONFIG=$RUNNER_TEMP/rclone/rclone.conf" >> "$GITHUB_ENV"
          echo "DRIVE_FOLDER=$FOLDER" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y rclone
          python -m pip install --disable-pip-version-check requests
      - name: Stream archive members to Drive
        env:
          ARCHIVE: ${{ inputs.archive }}
        run: python drive_ingest/upload.py "$ARCHIVE"

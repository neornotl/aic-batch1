name: AIC Evidence Video Bundles

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - query_id: query-p1-3-qa
            label: q3
          - query_id: query-p1-11-kis
            label: q11
          - query_id: query-p1-12-kis
            label: q12
          - query_id: query-p1-13-kis
            label: q13
          - query_id: query-p1-14-kis
            label: q14
          - query_id: query-p1-15-qa
            label: q15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install archive reader
        run: python -m pip install --disable-pip-version-check -e .
      - name: Download exact BTC keyframes and source videos
        run: |
          PYTHONPATH=. python scripts/build_evidence_bundles.py \
            --evidence competition_sotuyen1/EVIDENCE_FRAMES.csv \
            --queries "${{ matrix.query_id }}" \
            --output evidence-bundles
      - id: upload
        name: Upload ${{ matrix.label }} artifact ZIP
        uses: actions/upload-artifact@v4
        with:
          name: aic-evidence-${{ matrix.label }}-${{ github.run_number }}
          path: evidence-bundles/${{ matrix.label }}/
          retention-days: 7
          if-no-files-found: error
      - name: Publish artifact links in run summary
        run: |
          echo '## [${{ matrix.label }} evidence ZIP](${{ steps.upload.outputs.artifact-url }})' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove runner files
        if: always()
        run: rm -rf /tmp/aic-* evidence-bundles

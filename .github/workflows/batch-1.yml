name: AIC Batch 1

on:
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [L21, L23, L24, L25, L26_a, L26_b, L26_c, L26_d, L26_e, L27, L28, L29, L30]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Extract old results if available
        id: extract_old
        run: |
          if [ -f "old_results/results_${{ matrix.part }}.zip" ]; then
            echo "Extracting old results for ${{ matrix.part }}"
            unzip -q "old_results/results_${{ matrix.part }}.zip" -d .
            echo "exist=true" >> $GITHUB_OUTPUT
          else
            echo "No old results found for ${{ matrix.part }}"
            echo "exist=false" >> $GITHUB_OUTPUT
          fi

      - name: Download previous results from artifacts
        if: steps.extract_old.outputs.exist == 'false'
        uses: actions/download-artifact@v4
        with:
          name: results-${{ matrix.part }}
          path: .
        continue-on-error: true

      - name: Check if results exist
        id: check_results
        run: |
          if [ -f "results_${{ matrix.part }}.jsonl" ]; then
            echo "exist=true" >> $GITHUB_OUTPUT
            echo "Results found: results_${{ matrix.part }}.jsonl"
          else
            echo "exist=false" >> $GITHUB_OUTPUT
            echo "No results found, will run full"
          fi

      - name: Download keyframes
        if: steps.check_results.outputs.exist == 'false'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y aria2 unzip
          mkdir -p data
          aria2c -c -x 8 -s 8 \
            -d data \
            https://aic-data.ledo.io.vn/Keyframes_${{ matrix.part }}.zip

      - name: Extract keyframes
        if: steps.check_results.outputs.exist == 'false'
        run: |
          mkdir -p keyframes
          unzip -q data/*.zip -d keyframes
          rm -rf data

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run Luna
        if: steps.check_results.outputs.exist == 'false'
        env:
          AIC1: ${{ secrets.AIC1 }}
          AIC2: ${{ secrets.AIC2 }}
          AIC3: ${{ secrets.AIC3 }}
        run: |
          python run_batch.py keyframes results_${{ matrix.part }}.jsonl failed_${{ matrix.part }}.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.part }}
          path: |
            results_${{ matrix.part }}.jsonl
            failed_${{ matrix.part }}.json
          retention-days: 90

name: AIC Batch 1

on:
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [L21, L23, L24, L25, L26_a, L26_b, L26_c, L26_d, L26_e, L27, L28, L29, L30]

    steps:
      - name: Download keyframes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y aria2 unzip
          mkdir -p data
          aria2c -c -x 8 -s 8 \
            -d data \
            https://aic-data.ledo.io.vn/Keyframes_${{ matrix.part }}.zip

      - name: Extract
        run: |
          mkdir -p keyframes
          unzip -q data/*.zip -d keyframes
          rm -rf data

      - name: Install Python packages
        run: pip install requests

      - name: Run Luna
        env:
          AIC1: ${{ secrets.AIC1 }}
          AIC3: ${{ secrets.AIC3 }}
        run: |
          python run_batch.py keyframes results_${{ matrix.part }}.jsonl failed_${{ matrix.part }}.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.part }}
          path: |
            results_${{ matrix.part }}.jsonl
            failed_${{ matrix.part }}.json

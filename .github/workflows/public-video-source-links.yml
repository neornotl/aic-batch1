name: Publish public source-video links

on:
  workflow_dispatch:

# This workflow intentionally uses GitHub Release assets, not Actions
# artifacts.  Release asset URLs work without signing in, unlike artifact URLs.
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - question: Q1
            video: L30_V046
          - question: Q2
            video: L21_V003
          - question: Q5
            video: L26_V035
          - question: Q7
            video: L26_V041
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install archive reader
        run: python -m pip install --disable-pip-version-check -e .
      - name: Download one official source video with ZIP64 support
        run: |
          PYTHONPATH=. python scripts/download_official_video.py \
            --video "${{ matrix.video }}" \
            --output videos
      - name: Publish public direct links (no Actions artifact)
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="aic-${{ matrix.question }}-source-${{ github.run_number }}"
          gh release create "$tag" "videos/${{ matrix.video }}.mp4" \
            --title "AIC official source video — ${{ matrix.question }}" \
            --notes "Official source-video copy for manual review: ${{ matrix.question }} / ${{ matrix.video }}."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Print permanent direct links
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          echo '## Public direct video link' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "- ${{ matrix.question }} — [${{ matrix.video }}.mp4](https://github.com/${{ github.repository }}/releases/download/$TAG/${{ matrix.video }}.mp4)" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove runner files
        if: always()
        run: rm -rf videos

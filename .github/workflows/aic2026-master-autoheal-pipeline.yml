name: AIC2026 Master Auto-Heal & Overnight Ingestion Pipeline

on:
  schedule:
    # Run every 2 hours autonomously overnight until tomorrow afternoon
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target to auto-heal or ingest (all, batch1, batch2_cycling, batch2_traffic, batch2_news, k_series)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - batch1
          - batch2_cycling
          - batch2_traffic
          - batch2_news
          - k_series

concurrency:
  group: aic2026-master-overnight
  cancel-in-progress: false

jobs:
  plan-autoheal:
    name: Audit Gaps & Plan Auto-Heal
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.plan.outputs.tasks }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure rclone
        env:
          OAUTH_CONFIG: ${{ secrets.RCLONE_CONFIG_DRIVE }}
          SA: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          FOLDER: '1E8u-YURTRexdR1Ax4Hu2aq7Vt646VQuN'
        run: |
          test -n "$OAUTH_CONFIG" || test -n "$SA" || { echo 'Missing Drive credential'; exit 1; }
          mkdir -p "$RUNNER_TEMP/rclone"
          if test -n "$OAUTH_CONFIG"; then
            printf '%s' "$OAUTH_CONFIG" > "$RUNNER_TEMP/rclone/rclone.conf"
          else
            printf '%s' "$SA" > "$RUNNER_TEMP/rclone/sa.json"
            {
              echo '[drive]'
              echo 'type = drive'
              echo 'scope = drive'
              echo "service_account_file = $RUNNER_TEMP/rclone/sa.json"
              echo "root_folder_id = $FOLDER"
            } > "$RUNNER_TEMP/rclone/rclone.conf"
          fi
          echo "RCLONE_CONFIG=$RUNNER_TEMP/rclone/rclone.conf" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y rclone jq

      - id: plan
        name: Detect missing packages on Google Drive
        run: |
          TARGET="${{ inputs.target || 'all' }}"
          echo "Planning auto-heal for target: $TARGET"
          
          TASKS='[]'
          
          # Helper to add task
          add_task() {
            local category="$1"
            local name="$2"
            local url="$3"
            local dest="$4"
            TASKS=$(jq -c --arg c "$category" --arg n "$name" --arg u "$url" --arg d "$dest" \
              '. + [{"category": $c, "name": $n, "url": $u, "dest": $d}]' <<< "$TASKS")
          }

          # Helper to get object count safely (handles non-existent folders cleanly)
          safe_count() {
            local path="$1"
            local cnt
            cnt=$(rclone size "$path" --json 2>/dev/null | jq -r '.count // 0' 2>/dev/null || true)
            if [ -z "$cnt" ] || [ "$cnt" = "null" ]; then
              echo 0
            else
              echo "$cnt"
            fi
          }

          # 1. Check Batch 1 Gaps (L30 is priority)
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "batch1" ]; then
            L30_COUNT=$(safe_count "drive:Keyframes/L30")
            echo "Observed L30 frames on Drive: $L30_COUNT"
            if [ "$L30_COUNT" -lt 7900 ]; then
              echo "Adding L30 to auto-heal queue..."
              add_task "batch1_kf" "L30" "https://aic-data.ledo.io.vn/Keyframes_L30.zip" "drive:Keyframes/L30"
            fi
          fi

          # 2. Check Batch 2 Cycling Keyframes
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "batch2_cycling" ]; then
            S01_COUNT=$(safe_count "drive:Keyframes/Batch2/Keyframes_S01")
            echo "Observed Keyframes_S01 frames on Drive: $S01_COUNT"
            if [ "$S01_COUNT" -lt 500 ]; then
              echo "Adding Keyframes_S01 to auto-heal queue..."
              add_task "batch2_cycling_kf" "Keyframes_S01" "https://aic-data.ledo.io.vn/Keyframes_S01.zip" "drive:Keyframes/Batch2/Keyframes_S01"
            fi
          fi

          # 3. Check Batch 2 Traffic Keyframes
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "batch2_traffic" ]; then
            for i in $(seq -w 1 10 91); do
              END=$(printf "%03d" $((10#$i + 9)))
              PKG="Keyframes_N${i}-N${END}"
              PKG_COUNT=$(safe_count "drive:Keyframes/Batch2/${PKG}")
              echo "Observed $PKG frames on Drive: $PKG_COUNT"
              if [ "$PKG_COUNT" -lt 1000 ]; then
                echo "Adding $PKG to auto-heal queue..."
                add_task "batch2_traffic_kf" "$PKG" "https://aic-data.ledo.io.vn/${PKG}.zip" "drive:Keyframes/Batch2/${PKG}"
              fi
            done
          fi

          # 4. Check Batch 2 News Keyframes (M01-M10) & Videos (M01-M09)
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "batch2_news" ]; then
            for i in $(seq -w 1 10); do
              PKG="Keyframes_M${i}"
              PKG_COUNT=$(safe_count "drive:Keyframes/Batch2/${PKG}")
              echo "Observed $PKG frames on Drive: $PKG_COUNT"
              if [ "$PKG_COUNT" -lt 500 ]; then
                echo "Adding $PKG to auto-heal queue..."
                add_task "batch2_news_kf" "$PKG" "https://aic-data.ledo.io.vn/${PKG}.zip" "drive:Keyframes/Batch2/${PKG}"
              fi
            done
            for i in $(seq -w 1 9); do
              PKG="Videos_M${i}"
              PKG_COUNT=$(safe_count "drive:01_Videos_Batch2/${PKG}")
              echo "Observed $PKG videos on Drive: $PKG_COUNT"
              if [ "$PKG_COUNT" -lt 1 ]; then
                echo "Adding $PKG to auto-heal queue..."
                add_task "batch2_news_vid" "$PKG" "https://aic-data.ledo.io.vn/${PKG}.zip" "drive:01_Videos_Batch2/${PKG}"
              fi
            done
          fi

          # 5. Check Series K Keyframes & Videos
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "k_series" ]; then
            for i in $(seq -w 1 20); do
              PKG="Keyframes_K${i}"
              PKG_COUNT=$(safe_count "drive:Keyframes/Batch2/${PKG}")
              echo "Observed $PKG frames on Drive: $PKG_COUNT"
              if [ "$PKG_COUNT" -lt 500 ]; then
                echo "Adding $PKG to auto-heal queue..."
                add_task "k_series_kf" "$PKG" "https://aic-data.ledo.io.vn/${PKG}.zip" "drive:Keyframes/Batch2/${PKG}"
              fi
            done
            for i in $(seq -w 1 20); do
              PKG="Videos_K${i}"
              PKG_COUNT=$(safe_count "drive:01_Videos_Batch2/${PKG}")
              echo "Observed $PKG videos on Drive: $PKG_COUNT"
              if [ "$PKG_COUNT" -lt 1 ]; then
                echo "Adding $PKG to auto-heal queue..."
                add_task "k_series_vid" "$PKG" "https://aic-data.ledo.io.vn/${PKG}.zip" "drive:01_Videos_Batch2/${PKG}"
              fi
            done
          fi

          # Fallback if all are complete or empty queue: ensure non-empty array
          TASK_COUNT=$(jq 'length' <<< "$TASKS")
          echo "Total auto-heal tasks queued: $TASK_COUNT"
          if [ "$TASK_COUNT" -eq 0 ]; then
            echo 'tasks=[]' >> "$GITHUB_OUTPUT"
          else
            echo "tasks=$TASKS" >> "$GITHUB_OUTPUT"
          fi

  execute-autoheal:
    name: Auto-Heal ${{ matrix.task.name }}
    needs: plan-autoheal
    if: needs.plan-autoheal.outputs.tasks != '[]' && needs.plan-autoheal.outputs.tasks != ''
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        task: ${{ fromJson(needs.plan-autoheal.outputs.tasks) }}
    steps:
      - uses: actions/checkout@v4

      - name: Maximize Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h

      - name: Configure rclone
        env:
          OAUTH_CONFIG: ${{ secrets.RCLONE_CONFIG_DRIVE }}
          SA: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          FOLDER: '1E8u-YURTRexdR1Ax4Hu2aq7Vt646VQuN'
        run: |
          mkdir -p "$RUNNER_TEMP/rclone"
          if test -n "$OAUTH_CONFIG"; then
            printf '%s' "$OAUTH_CONFIG" > "$RUNNER_TEMP/rclone/rclone.conf"
          else
            printf '%s' "$SA" > "$RUNNER_TEMP/rclone/sa.json"
            {
              echo '[drive]'
              echo 'type = drive'
              echo 'scope = drive'
              echo "service_account_file = $RUNNER_TEMP/rclone/sa.json"
              echo "root_folder_id = $FOLDER"
            } > "$RUNNER_TEMP/rclone/rclone.conf"
          fi
          echo "RCLONE_CONFIG=$RUNNER_TEMP/rclone/rclone.conf" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y rclone unzip curl aria2

      - name: Download archive via aria2c with auto-retries
        run: |
          NAME="${{ matrix.task.name }}"
          URL="${{ matrix.task.url }}"
          echo "Downloading $NAME from $URL..."
          aria2c -x 16 -s 16 -k 1M --file-allocation=none --retry-wait=3 -m 15 "$URL" -d "$RUNNER_TEMP" -o "${NAME}.zip"
          ls -lh "$RUNNER_TEMP/${NAME}.zip"

      - name: Unpack keyframes
        run: |
          NAME="${{ matrix.task.name }}"
          EXTRACT_DIR="$RUNNER_TEMP/extracted"
          mkdir -p "$EXTRACT_DIR"
          echo "Extracting ${NAME}.zip..."
          unzip -q "$RUNNER_TEMP/${NAME}.zip" -d "$EXTRACT_DIR"
          rm -f "$RUNNER_TEMP/${NAME}.zip"
          ls -lh "$EXTRACT_DIR"

      - name: Resilient upload to Drive (Auto-Resume on Interruption)
        run: |
          NAME="${{ matrix.task.name }}"
          DEST="${{ matrix.task.dest }}"
          EXTRACT_DIR="$RUNNER_TEMP/extracted"
          
          # Auto-detect source directory (keyframes/, videos/, or root)
          if [ -d "$EXTRACT_DIR/keyframes" ]; then
            SRC_DIR="$EXTRACT_DIR/keyframes"
          elif [ -d "$EXTRACT_DIR/videos" ]; then
            SRC_DIR="$EXTRACT_DIR/videos"
          else
            SRC_DIR="$EXTRACT_DIR"
          fi
          
          echo "Uploading $SRC_DIR to $DEST with 5 automatic retries..."
          SUCCESS=0
          for attempt in 1 2 3 4 5; do
            echo "--- Upload Attempt $attempt/5 for $NAME ---"
            if rclone copy "$SRC_DIR" "$DEST" \
              --transfers 16 \
              --checkers 32 \
              --fast-list \
              --retries 5 \
              --retries-sleep 10s \
              --low-level-retries 10 \
              --drive-pacer-min-sleep 50ms \
              --stats 30s \
              -v; then
              echo "Upload of $NAME succeeded on attempt $attempt!"
              SUCCESS=1
              break
            else
              echo "Attempt $attempt failed. Waiting 20s before auto-retry..."
              sleep 20
            fi
          done
          
          rm -rf "$EXTRACT_DIR"
          if [ "$SUCCESS" -ne 1 ]; then
            echo "ERROR: Failed to complete upload for $NAME after 5 retries"
            exit 1
          fi
